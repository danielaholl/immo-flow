version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: immoflow-postgres-dev
    environment:
      POSTGRES_DB: immoflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: immoflow-redis-dev
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile.dev
    container_name: immoflow-api-dev
    ports:
      - "4000:4000"
    volumes:
      # Source code mounts for hot reload
      - ./apps/api/src:/app/apps/api/src
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/api/node_modules
    env_file:
      - .env.dev
    environment:
      - PORT=4000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=immoflow
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: pnpm dev

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile.dev
    container_name: immoflow-web-dev
    ports:
      - "3000:3000"
    volumes:
      # Source code mounts for hot reload
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    env_file:
      - .env.dev
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - API_URL=http://api:4000
      - NODE_ENV=development
    depends_on:
      - api
    command: pnpm dev

volumes:
  postgres-data-dev:
